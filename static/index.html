<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sports Analytics Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --accent: #238636;
            --gold: #f1e05a;
            --text: #c9d1d9;
            --text-white: #ffffff;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
        }
        .container { max-width: 650px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
        }
        .header h1 { font-size: 22px; color: var(--text-white); margin: 0; }
        .header p { font-size: 13px; color: #8b949e; margin-top: 4px; }
        
        .sports-toggle { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn {
            flex: 1; padding: 10px; border: 1px solid var(--border);
            background: var(--card); color: var(--text); font-weight: 600;
            border-radius: 8px; cursor: pointer; text-align: center;
        }
        .btn.active { background: #1f6feb; color: white; border-color: #388bfd; }
        
        .match-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 14px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .teams { font-weight: 700; color: var(--text-white); font-size: 15px; }
        .btn-analyze {
            background: var(--accent); color: white; border: none;
            padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer;
        }
        
        /* AI PREDICTION CARD */
        .ai-card {
            background: linear-gradient(135deg, #161b22 0%, #1c2128 100%);
            border: 2px solid #238636; border-radius: 12px; padding: 16px; margin-bottom: 15px;
        }
        .ai-badge {
            background: #238636; color: white; padding: 4px 10px;
            border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-block;
        }
        .ai-title { font-size: 18px; color: var(--gold); font-weight: 800; margin: 10px 0 5px 0; }
        
        .prob-bar-container { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 12px 0; }
        .prob-home { background: #238636; }
        .prob-draw { background: #8b949e; }
        .prob-away { background: #da3633; }
        
        .prob-labels { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; }
        
        .factors-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .factors-table td { padding: 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .factors-table td:last-child { text-align: right; font-weight: 700; color: var(--text-white); }
        
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚡ AI Sports Analytics Pro</h1>
        <p>Yapay Zeka Destekli Derin Maç Analiz Motoru</p>
    </div>

    <div class="sports-toggle">
        <div id="btn-futbol" class="btn active" onclick="loadFixtures('futbol')">⚽ Futbol</div>
        <div id="btn-basketbol" class="btn" onclick="loadFixtures('basketbol')">🏀 Basketbol</div>
    </div>

    <div id="analysis-view" class="hidden">
        <button class="btn" style="margin-bottom: 12px; width: 100%;" onclick="showList()">← Maç Listesine Dön</button>
        <div id="analysis-content"></div>
    </div>

    <div id="fixtures-list"></div>
</div>

<script>
let currentSport = 'futbol';

async function loadFixtures(sport) {
    currentSport = sport;
    document.getElementById('btn-futbol').className = sport === 'futbol' ? 'btn active' : 'btn';
    document.getElementById('btn-basketbol').className = sport === 'basketbol' ? 'btn active' : 'btn';
    
    const list = document.getElementById('fixtures-list');
    list.innerHTML = '<p style="text-align:center;">Maçlar yükleniyor...</p>';
    
    try {
        const res = await fetch(`/api/fixtures?sport=${sport}`);
        const data = await res.json();
        
        list.innerHTML = '';
        if(!data.fixtures || data.fixtures.length === 0) {
            list.innerHTML = '<p style="text-align:center;">Bugün için maç bulunamadı.</p>';
            return;
        }
        
        data.fixtures.forEach(f => {
            list.innerHTML += `
                <div class="match-card">
                    <div>
                        <div class="teams">${f.home_name} vs ${f.away_name}</div>
                        <div style="font-size:12px; color:#8b949e;">${f.date.slice(11,16) || 'Bugün'} | Durum: ${f.status}</div>
                    </div>
                    <button class="btn-analyze" onclick="analyzeMatch(${f.fixture_id})">AI Analiz</button>
                </div>
            `;
        });
    } catch(e) {
        list.innerHTML = '<p style="text-align:center; color:red;">Maçlar çekilemedi.</p>';
    }
}

async function analyzeMatch(id) {
    document.getElementById('fixtures-list').classList.add('hidden');
    document.getElementById('analysis-view').classList.remove('hidden');
    const content = document.getElementById('analysis-content');
    content.innerHTML = '<p style="text-align:center;">Yapay Zeka Analizi Hesaplıyor...</p>';

    try {
        const res = await fetch(`/api/analyze?sport=${currentSport}&fixture_id=${id}`);
        const data = await res.json();
        
        const hProb = Math.round(data.final.home * 100);
        const dProb = Math.round(data.final.draw * 100);
        const aProb = Math.round(data.final.away * 100);
        
        let prediction = "Maç Sonucu 1";
        let bestProb = hProb;
        if(aProb > hProb && aProb > dProb) { prediction = "Maç Sonucu 2"; bestProb = aProb; }
        else if(dProb > hProb && dProb > aProb) { prediction = "Beraberlik / 2.5 Alt"; bestProb = dProb; }

        content.innerHTML = `
            <div class="ai-card">
                <span class="ai-badge">🤖 YAPAY ZEKA TAHMİNİ</span>
                <div class="ai-title">${data.home_name} vs ${data.away_name}</div>
                <h2 style="color:#238636; margin: 10px 0;">Öneri: ${prediction} (%${bestProb} Güven)</h2>
                
                <div class="prob-labels">
                    <span>MS 1: %${hProb}</span>
                    <span>MS X: %${dProb}</span>
                    <span>MS 2: %${aProb}</span>
                </div>
                <div class="prob-bar-container">
                    <div class="prob-home" style="width: ${hProb}%"></div>
                    <div class="prob-draw" style="width: ${dProb}%"></div>
                    <div class="prob-away" style="width: ${aProb}%"></div>
                </div>
            </div>

            <div class="match-card" style="display:block;">
                <h3 style="margin-top:0; color:var(--text-white);">📊 6 Faktörlü Veri Kırılımı</h3>
                <table class="factors-table">
                    ${data.breakdown.map(b => `<tr><td>${b.name}</td><td>${b.value}</td></tr>`).join('')}
                </table>
            </div>
        `;
    } catch(e) {
        content.innerHTML = '<p style="text-align:center; color:red;">Analiz oluşturulamadı.</p>';
    }
}

function showList() {
    document.getElementById('analysis-view').classList.add('hidden');
    document.getElementById('fixtures-list').classList.remove('hidden');
}

loadFixtures('futbol');
</script>
</body>
</html>
